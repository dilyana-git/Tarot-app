name: Keep Render Awake

# GitHub schedules are best-effort. Run every five minutes, offset from the
# start of each hour, to reduce the chance of a gap over Render's 15-minute
# idle limit. Keep this file on the repository's default branch.
on:
  schedule:
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping app
        # Request the public app endpoint so the request reaches Render.
        # Retry if a missed schedule has already allowed the app to sleep.
        run: |
          curl --fail-with-body --silent --show-error --location \
            --retry 3 --retry-delay 20 --retry-all-errors \
            --connect-timeout 15 --max-time 90 \
            --write-out 'HTTP %{http_code}; total %{time_total}s\n' \
            https://tarot.samodiva.space/health
