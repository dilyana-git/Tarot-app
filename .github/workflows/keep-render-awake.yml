name: Keep Render Awake

# GitHub schedules are best-effort. Three staggered schedules collectively run
# every five minutes and avoid the busy start of each hour. The push trigger
# validates changes to this workflow immediately. Keep this file on the
# repository's default branch.
on:
  push:
    branches:
      - claude/tarot-app-project-dSzbt
    paths:
      - .github/workflows/keep-render-awake.yml
  schedule:
    - cron: "3,18,33,48 * * * *"
    - cron: "8,23,38,53 * * * *"
    - cron: "13,28,43,58 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping app
        # Request the public app endpoint so the request reaches Render.
        # Retry if a missed schedule has already allowed the app to sleep.
        run: |
          curl --fail-with-body --silent --show-error --location \
            --retry 3 --retry-delay 20 --retry-all-errors \
            --connect-timeout 15 --max-time 90 \
            --write-out 'HTTP %{http_code}; total %{time_total}s\n' \
            https://tarot.samodiva.space/health
