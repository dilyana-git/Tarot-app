name: Keep Render Awake

# GitHub schedules are best-effort. Run every ten minutes, offset from the
# busy start of each hour. The push trigger validates changes immediately.
# Keep this file on the repository's default branch.
on:
  push:
    branches:
      - claude/tarot-app-project-dSzbt
    paths:
      - .github/workflows/keep-render-awake.yml
  schedule:
    - cron: "5,15,25,35,45,55 * * * *" # Every 10 minutes starting at 5 minutes past the hour
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping app
        # Request the public app endpoint so the request reaches Render.
        # Retry if a missed schedule has already allowed the app to sleep.
        run: |
          curl --fail-with-body --silent --show-error --location \
            --retry 3 --retry-delay 20 --retry-all-errors \
            --connect-timeout 15 --max-time 90 \
            --write-out 'HTTP %{http_code}; total %{time_total}s\n' \
            https://tarot.samodiva.space/health
