<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Arcana — The Tarot Oracle{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cinzel+Decorative:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  {% block head %}{% endblock %}
</head>
<body>
  <canvas id="stars-canvas"></canvas>

  <nav class="navbar">
    <a href="{{ url_for('index') }}" class="nav-brand">
      <span class="brand-symbol">✦</span>
      <span class="brand-name">Arcana</span>
    </a>
    <ul class="nav-links">
      <li><a href="{{ url_for('index') }}" class="nav-link {% if request.endpoint == 'index' %}active{% endif %}">Home</a></li>
      <li><a href="{{ url_for('cards') }}" class="nav-link {% if request.endpoint == 'cards' %}active{% endif %}">The Cards</a></li>
      <li><a href="{{ url_for('reading') }}" class="nav-link {% if request.endpoint == 'reading' %}active{% endif %}">Reading</a></li>
    </ul>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">☰</button>
  </nav>

  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <p class="footer-symbol">✦ ☽ ✦</p>
      <p class="footer-text">Arcana — The Tarot Oracle &nbsp;|&nbsp; For entertainment &amp; reflection</p>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
