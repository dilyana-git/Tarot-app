<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Arcana — The Tarot Oracle{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}Arcana — an interactive tarot oracle. Explore all 78 cards of the Major and Minor Arcana, and draw a reading for contemplation and reflection.{% endblock %}" />
  <meta name="theme-color" content="#0A0B11" />
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml" />

  <!-- Open Graph / Twitter -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Arcana" />
  <meta property="og:title" content="{{ self.title() }}" />
  <meta property="og:description" content="{{ self.meta_description() }}" />
  <meta property="og:image" content="{{ url_for('static', filename='favicon.svg', _external=True) }}" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="{{ self.title() }}" />
  <meta name="twitter:description" content="{{ self.meta_description() }}" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  {% block head %}{% endblock %}
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <canvas id="stars-canvas" aria-hidden="true"></canvas>
  <svg class="bg-sparkles" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
    <text fill="rgba(201,168,76,0.35)" font-size="14" font-family="serif" x="108" y="95">✦</text>
    <text fill="rgba(201,168,76,0.22)" font-size="10" font-family="serif" x="340" y="42">✦</text>
    <text fill="rgba(201,168,76,0.38)" font-size="9"  font-family="serif" x="685" y="128">✦</text>
    <text fill="rgba(201,168,76,0.18)" font-size="13" font-family="serif" x="920" y="68">✦</text>
    <text fill="rgba(201,168,76,0.28)" font-size="11" font-family="serif" x="1180" y="112">✦</text>
    <text fill="rgba(201,168,76,0.40)" font-size="8"  font-family="serif" x="1385" y="58">✦</text>
    <text fill="rgba(201,168,76,0.20)" font-size="15" font-family="serif" x="52" y="425">✦</text>
    <text fill="rgba(201,168,76,0.30)" font-size="12" font-family="serif" x="1412" y="320">✦</text>
    <text fill="rgba(201,168,76,0.25)" font-size="10" font-family="serif" x="242" y="755">✦</text>
    <text fill="rgba(201,168,76,0.18)" font-size="9"  font-family="serif" x="485" y="682">✦</text>
    <text fill="rgba(201,168,76,0.32)" font-size="13" font-family="serif" x="850" y="825">✦</text>
    <text fill="rgba(201,168,76,0.22)" font-size="11" font-family="serif" x="1105" y="778">✦</text>
    <text fill="rgba(201,168,76,0.28)" font-size="9"  font-family="serif" x="1338" y="660">✦</text>
    <text fill="rgba(201,168,76,0.38)" font-size="8"  font-family="serif" x="618" y="315">✦</text>
    <text fill="rgba(201,168,76,0.25)" font-size="12" font-family="serif" x="1052" y="182">✦</text>
  </svg>

  <nav class="navbar">
    <a href="{{ url_for('index') }}" class="nav-brand">
      <span class="brand-rule"></span>
      <span class="brand-name">Arcana</span>
      <span class="brand-rule"></span>
    </a>
    <ul class="nav-links">
      <li><a href="{{ url_for('index') }}" class="nav-link {% if request.endpoint == 'index' %}active{% endif %}">Home</a></li>
      <li><a href="{{ url_for('cards') }}" class="nav-link {% if request.endpoint == 'cards' %}active{% endif %}">The Cards</a></li>
      <li><a href="{{ url_for('reading') }}" class="nav-link {% if request.endpoint == 'reading' %}active{% endif %}">Reading</a></li>
    </ul>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">☰</button>
  </nav>

  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  {% block footer %}
  <footer class="footer">
    <div class="footer-inner">
      <hr class="footer-rule" aria-hidden="true" />
      <p class="footer-text">Arcana &ensp;·&ensp; The Tarot Oracle &ensp;·&ensp; For contemplation &amp; reflection</p>
    </div>
  </footer>
  {% endblock %}

  {% block scripts %}{% endblock %}
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
